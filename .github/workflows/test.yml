name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version from requires-python (>=3.11) to the newest release.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # Installs the locked dev group, which includes the pinned build backend
      # (hatchling): tests/test_build.py then builds every distribution offline
      # with it, so the gate downloads nothing beyond this step.
      - run: uv sync --locked
      - run: uv run --locked pytest
