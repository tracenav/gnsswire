[build-system]
requires = ["hatchling>=1.27"]   # 1.27: PEP 639 licence metadata
build-backend = "hatchling.build"

[project]
name = "gnsswire-spartn"
version = "0.2.0"
description = "SPARTN v2 framing, decryption and OCB/HPAC/GAD/BPAC messages, as integer fields."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "the gnsswire authors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["gnsswire-bits>=0.2.0,<0.3"]   # the compatible range of bits (README, Versions)

[project.urls]
Homepage = "https://github.com/tracenav/gnsswire"
Source = "https://github.com/tracenav/gnsswire/tree/main/packages/spartn"
Changelog = "https://github.com/tracenav/gnsswire/blob/main/RELEASES.md"
Issues = "https://github.com/tracenav/gnsswire/issues"

[tool.uv.sources]
gnsswire-bits = { workspace = true }

# gnsswire is a namespace shared by several distributions: no __init__.py at that level.
[tool.hatch.build.targets.wheel]
packages = ["src/gnsswire"]
