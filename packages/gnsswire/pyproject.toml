[build-system]
requires = ["hatchling>=1.27"]   # 1.27: PEP 639 licence metadata
build-backend = "hatchling.build"

# Installs every codec. It has no modules of its own, so that the gnsswire
# namespace stays shared: its wheel holds only its .dist-info.
[project]
name = "gnsswire"
version = "0.2.0"
description = "Pure-Python codecs for GNSS wire formats: NMEA 0183, UBX, RTCM 3, SPARTN and SkyTraq, RINEX observation files, and broadcast navigation messages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Trace Navigation LLC" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
# The compatible range of each (README, Versions).
dependencies = [
    "gnsswire-bits>=0.2.0,<0.3",
    "gnsswire-nmea>=0.2.0,<0.3",
    "gnsswire-ubx>=0.1.1,<0.2",
    "gnsswire-rtcm3>=0.2.0,<0.3",
    "gnsswire-spartn>=0.2.0,<0.3",
    "gnsswire-skytraq>=0.1.0,<0.2",
    "gnsswire-rinex>=0.1.0,<0.2",
    "gnsswire-nav>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://github.com/tracenav/gnsswire"
Source = "https://github.com/tracenav/gnsswire"
Changelog = "https://github.com/tracenav/gnsswire/blob/main/RELEASES.md"
Issues = "https://github.com/tracenav/gnsswire/issues"

[tool.uv.sources]
gnsswire-bits = { workspace = true }
gnsswire-nmea = { workspace = true }
gnsswire-ubx = { workspace = true }
gnsswire-rtcm3 = { workspace = true }
gnsswire-spartn = { workspace = true }
gnsswire-skytraq = { workspace = true }
gnsswire-rinex = { workspace = true }
gnsswire-nav = { workspace = true }

[tool.hatch.build.targets.wheel]
bypass-selection = true
