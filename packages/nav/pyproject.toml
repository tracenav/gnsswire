[build-system]
requires = ["hatchling>=1.27"]   # 1.27: PEP 639 licence metadata
build-backend = "hatchling.build"

[project]
name = "gnsswire-nav"
version = "0.1.0"
description = "Broadcast navigation messages (GPS LNAV, Galileo I/NAV and F/NAV, BeiDou D1 and D2, GLONASS strings) as integer fields, and their ephemerides from UBX and SkyTraq navigation words."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "the gnsswire authors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["gnsswire-bits>=0.2.0,<0.3"]   # the compatible range of bits (README, Versions)

[project.urls]
Homepage = "https://github.com/tracenav/gnsswire"
Source = "https://github.com/tracenav/gnsswire/tree/main/packages/nav"
Changelog = "https://github.com/tracenav/gnsswire/blob/main/RELEASES.md"
Issues = "https://github.com/tracenav/gnsswire/issues"

# gnsswire is a namespace shared by several distributions: no __init__.py at that level.
[tool.hatch.build.targets.wheel]
packages = ["src/gnsswire"]
